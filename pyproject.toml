[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hackerrank-support-agent"
version = "0.1.0"
description = "Terminal-based HackerRank support triage agent"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10,<3",
    "python-dotenv>=1.0,<2",
]

[project.scripts]
support-agent = "support_agent.cli:main"